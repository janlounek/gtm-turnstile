name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # check-tpl must run first: if the generated codec has drifted between the
      # signing client and the verifying variable, every verdict cookie would fail
      # validation in production and every visitor would silently become `unknown`.
      - run: node build/check-tpl.js
      - run: node --test
